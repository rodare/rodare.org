<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Search</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; }
    mark { background-color: yellow; }
    h3 { margin-bottom: 5px; }
    p { color: #555; }
  </style>
</head>
<body>
  <h1>Search</h1>
  <input type="text" id="searchBox" placeholder="Type to search..." style="width: 300px; padding: 5px;">
  <div id="results"></div>

  <script>
    let searchIndex = [];

    fetch('search.json')
      .then(response => response.json())
      .then(data => {
        searchIndex = data;
      });

    document.getElementById('searchBox').addEventListener('input', function () {
      const query = this.value.trim();
      const resultsDiv = document.getElementById('results');
      resultsDiv.innerHTML = '';

      if (!query) return;

      // Corrected RegExp constructor with backticks
      const regex = new RegExp(`(${query.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');

      const results = searchIndex.filter(item => 
        regex.test(item.title) || regex.test(item.text)
      );

      results.forEach(result => {
        const textLower = result.text.toLowerCase();
        const queryLower = query.toLowerCase();
        const matchIndex = textLower.indexOf(queryLower);

        let snippet = '';

        if (matchIndex !== -1) {
          const start = Math.max(0, matchIndex - 50);
          const end = Math.min(result.text.length, matchIndex + query.length + 50);
          snippet = result.text.substring(start, end);
        } else {
          snippet = result.text.substring(0, 100);
        }

        const highlightedSnippet = snippet.replace(regex, '<mark>$1</mark>');
        const highlightedTitle = result.title.replace(regex, '<mark>$1</mark>');

        const div = document.createElement('div');
        // Corrected template literal with backticks
        div.innerHTML = `
          <h3><a href="${result.url}?highlight=${encodeURIComponent(query)}">${highlightedTitle}</a></h3>
          <p>...${highlightedSnippet}...</p>
        `;
        resultsDiv.appendChild(div);
      });
    });
  </script>
<script src="js/main.js"></script>
<script src="js/highlight-search.js"></script>

</body>
</html>
